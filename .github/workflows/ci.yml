name: BookPro CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bookpro_user:bookpro_pass@localhost:5432/bookpro_test?schema=public
      DIRECT_URL: postgresql://bookpro_user:bookpro_pass@localhost:5432/bookpro_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: bookpro-ci-only-jwt-secret-rotate-never-use-in-production
      COOKIE_SECRET: bookpro-ci-only-cookie-secret-rotate-never-use

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookpro_user
          POSTGRES_PASSWORD: bookpro_pass
          POSTGRES_DB: bookpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply Database Migrations
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Monorepo Typecheck
        run: pnpm typecheck

      - name: Monorepo Lint
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @bookpro/web exec playwright install --with-deps chromium

      - name: Run Web End-to-End Tests
        env:
          CI: "true"
        run: pnpm --filter @bookpro/web test:e2e

      - name: Build All Workspaces
        run: pnpm build

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high
